name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/morgan-lawn-care
            git pull origin main
            npm install
            npm run build
            sudo docker rm -f morgan || true
            sudo docker run -d --name morgan -p 80:80 \
              -v /home/ubuntu/morgan-lawn-care/dist:/usr/share/nginx/html \
              -v /home/ubuntu/morgan-lawn-care/default.conf:/etc/nginx/conf.d/default.conf \
              nginx
            echo "Deployed at $(date)"
